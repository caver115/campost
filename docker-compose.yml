name: campost

services:
  campost:
    container_name: campost
    # Cameras are reachable only through a route on the host; bridge NAT breaks it.
    network_mode: host
    build:
      context: .
      dockerfile: image/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./urls.txt:/app/urls.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
